'''Keyboard input support

Scientific functions (√, x², sin, cos, tan)

Copy to clipboard

Clear history

Display full expression in histor'''

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calculator {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #eee;
        }

        #equals {
            background-color: #4caf50;
            color: black;
        }

        #darkModeToggle {
            background-color: #333;
            color: white;
        }

        #history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
        }

        #historyList {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .dark-mode {
            background-color: #333;
            color: white;
        }

        .dark-mode #display {
            background-color: #555;
            color: white;
        }

        .dark-mode .btn {
            background-color: #555;
            color: white;
        }

        .dark-mode #equals {
            background-color: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="btn" onclick="clearDisplay()">C</button>
            <button class="btn" onclick="deleteChar()">DEL</button>
            <button class="btn" onclick="appendToDisplay('%')">%</button>
            <button class="btn" onclick="appendToDisplay('/')">/</button>
            <button class="btn" onclick="appendToDisplay('7')">7</button>
            <button class="btn" onclick="appendToDisplay('8')">8</button>
            <button class="btn" onclick="appendToDisplay('9')">9</button>
            <button class="btn" onclick="appendToDisplay('*')">*</button>
            <button class="btn" onclick="appendToDisplay('4')">4</button>
            <button class="btn" onclick="appendToDisplay('5')">5</button>
            <button class="btn" onclick="appendToDisplay('6')">6</button>
            <button class="btn" onclick="appendToDisplay('-')">-</button>
            <button class="btn" onclick="appendToDisplay('1')">1</button>
            <button class="btn" onclick="appendToDisplay('2')">2</button>
            <button class="btn" onclick="appendToDisplay('3')">3</button>
            <button class="btn" onclick="appendToDisplay('+')">+</button>
            <button class="btn" onclick="appendToDisplay('0')">0</button>
            <button class="btn" onclick="appendToDisplay('.')">.</button>
            <button class="btn" id="equals" onclick="calculate()">=</button>
            <button class="btn" id="darkModeToggle" onclick="toggleDarkMode()">🌙</button>

            <!-- New Scientific and Utility Buttons -->
            <button class="btn" onclick="appendToDisplay('Math.sqrt(')">√</button>
            <button class="btn" onclick="appendToDisplay('**2')">x²</button>
            <button class="btn" onclick="appendToDisplay('Math.sin(')">sin</button>
            <button class="btn" onclick="appendToDisplay('Math.cos(')">cos</button>
            <button class="btn" onclick="appendToDisplay('Math.tan(')">tan</button>
            <button class="btn" onclick="copyResult()">📋</button>
            <button class="btn" onclick="clearHistory()">🗑️</button>
        </div>
        <div id="history">
            <h2>History</h2>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script>
        let isDarkMode = false;

        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        function deleteChar() {
            let display = document.getElementById('display').value;
            document.getElementById('display').value = display.slice(0, -1);
        }

        function calculate() {
            try {
                let expression = document.getElementById('display').value;
                let result = eval(expression);
                document.getElementById('display').value = result;
                addToHistory(expression + ' = ' + result);
            } catch (error) {
                document.getElementById('display').value = 'Error';
            }
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
        }

        function addToHistory(entry) {
            let historyList = document.getElementById('historyList');
            let historyItem = document.createElement('li');
            historyItem.textContent = entry;
            historyList.appendChild(historyItem);
        }

        function clearHistory() {
            document.getElementById('historyList').innerHTML = '';
        }

        function copyResult() {
            const display = document.getElementById('display');
            navigator.clipboard.writeText(display.value)
                .then(() => alert('Copied to clipboard!'))
                .catch(() => alert('Failed to copy!'));
        }

        // Keyboard support
        document.addEventListener('keydown', function (event) {
            const key = event.key;
            if ((/[\d+\-*/%.]/.test(key)) || key === '.') {
                appendToDisplay(key);
            } else if (key === 'Enter') {
                calculate();
            } else if (key === 'Backspace') {
                deleteChar();
            }
        });
    </script>
</body>
</html>
